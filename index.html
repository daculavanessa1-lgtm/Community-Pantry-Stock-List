<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay Community Pantry Stock List</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #15803d;
      --accent-hover: #166534;
      --ok-bg: #dcfce7;
      --ok-ink: #166534;
      --low-bg: #fef3c7;
      --low-ink: #92400e;
      --out-bg: #fee2e2;
      --out-ink: #991b1b;
      --danger: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      padding: 20px 14px 48px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .admin-bar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .role-badge {
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--ink);
    }

    body.is-admin .role-badge {
      background: var(--ok-bg);
      color: var(--ok-ink);
    }

    .admin-bar input {
      flex: 1;
      min-width: 140px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--ink);
      background: #fff;
    }

    .btn-sm {
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
    }

    .btn-unlock {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    body:not(.is-admin) .admin-only {
      display: none !important;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    .stat-val.low {
      color: var(--low-ink);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr;
      gap: 10px;
    }

    @media (max-width: 520px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(21, 128, 61, 0.25);
      border-color: var(--accent);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 11px 16px;
      font-size: 0.95rem;
      width: 100%;
      margin-top: 4px;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 11px;
      font-size: 0.82rem;
      background: var(--card);
      color: var(--muted);
      border-color: var(--line);
    }

    .filter-btn.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .count-note {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .cat-tag {
      font-size: 0.75rem;
      color: var(--muted);
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .badge {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok-ink);
    }

    .badge.low {
      background: var(--low-bg);
      color: var(--low-ink);
    }

    .badge.out {
      background: var(--out-bg);
      color: var(--out-ink);
    }

    .updated {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-text {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 64px;
      text-align: right;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      background: #f1f5f9;
      color: var(--ink);
      border-color: var(--line);
      font-size: 1rem;
    }

    .del-btn {
      padding: 6px 10px;
      font-size: 0.82rem;
      background: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Barangay Community-Pantry-Stock-List</h1>
      <p class="subtitle">inventory tracker</p>
    </header>

    <div class="admin-bar" id="admin-gate">
      <span class="role-badge" id="role-status">View Only</span>
      <input
        type="password"
        id="admin-passcode"
        placeholder="Admin passcode"
        aria-label="Admin passcode"
      />
      <button type="button" class="btn-sm btn-unlock" id="unlock-btn" onclick="unlockAdmin()">Unlock</button>
      <button type="button" class="btn-sm" id="lock-btn" onclick="lockAdmin()" style="display: none;">Lock</button>
    </div>

    <section class="summary" aria-label="Stock summary">
      <div class="stat">
        <div class="stat-label">Total Units in Stock</div>
        <div class="stat-val" id="total-units">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Low / Out of Stock</div>
        <div class="stat-val low" id="low-count">0</div>
      </div>
    </section>

    <section class="card admin-only" aria-label="Add stock item">
      <form id="stock-form" class="form-grid">
        <div class="field">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Rice / Canned Goods / Vegetables" required />
        </div>
        <div class="field">
          <label for="item-cat">Category</label>
          <select id="item-cat">
            <option value="Food">Food</option>
            <option value="Hygiene">Hygiene</option>
            <option value="Schoolsupplies">Schoolsupplies</option>
          </select>
        </div>
        <div class="field">
          <label for="item-qty">Quantity</label>
          <input type="number" id="item-qty" min="0" value="10" required />
        </div>
        <div class="field full">
          <button type="submit" class="btn-add">Add Stock Item</button>
        </div>
      </form>
    </section>

    <div class="toolbar">
      <div class="filters" id="category-filters">
        <button type="button" class="filter-btn active" data-cat="All">All</button>
        <button type="button" class="filter-btn" data-cat="Food">Food</button>
        <button type="button" class="filter-btn" data-cat="Hygiene">Hygiene</button>
        <button type="button" class="filter-btn" data-cat="Schoolsupplies">Schoolsupplies</button>
      </div>
      <div class="count-note" id="count-note">0 items</div>
    </div>

    <section class="list" id="stock-list" aria-label="Stock items"></section>
  </div>

  <script>
    const STORAGE_KEY = "pantryStockItems_v1";
    const ADMIN_CODE = "pantry123";
    const LOW_THRESHOLD = 5;

    const DEFAULT_ITEMS = [
      { id: 1, name: "Rice (kg)", category: "Food", qty: 40, updated: formatTime(new Date()) },
      { id: 2, name: "Canned Sardines", category: "Food", qty: 4, updated: formatTime(new Date()) },
      { id: 3, name: "Bath Soap", category: "Hygiene", qty: 18, updated: formatTime(new Date()) },
      { id: 4, name: "Notebooks", category: "Schoolsupplies", qty: 25, updated: formatTime(new Date()) }
    ];

    let items = loadItems();
    let activeCategory = "All";

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...DEFAULT_ITEMS];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...DEFAULT_ITEMS];
      } catch {
        return [...DEFAULT_ITEMS];
      }
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getStatusBadge(qty) {
      if (qty <= 0) return '<span class="badge out">Out of Stock</span>';
      if (qty <= LOW_THRESHOLD) return '<span class="badge low">Low</span>';
      return '<span class="badge ok">In Stock</span>';
    }

    function render() {
      const totalUnits = items.reduce((sum, item) => sum + Number(item.qty || 0), 0);
      const lowOrOut = items.filter((item) => Number(item.qty || 0) <= LOW_THRESHOLD).length;

      document.getElementById("total-units").textContent = totalUnits;
      document.getElementById("low-count").textContent = lowOrOut;

      const filtered = activeCategory === "All"
        ? items
        : items.filter((item) => item.category === activeCategory);

      document.getElementById("count-note").textContent =
        `${filtered.length} ${filtered.length === 1 ? "item" : "items"}`;

      const listEl = document.getElementById("stock-list");
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">No items in this category yet.</div>';
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (item) => `
          <div class="item-row">
            <div>
              <div class="item-top">
                <span class="item-name">${escapeHtml(item.name)}</span>
                <span class="cat-tag">${escapeHtml(item.category)}</span>
                ${getStatusBadge(item.qty)}
              </div>
              <div class="updated">Updated ${escapeHtml(item.updated || "")}</div>
            </div>
            <div class="item-actions">
              <span class="qty-text">${Number(item.qty)} pcs</span>
              <button type="button" class="qty-btn admin-only" onclick="changeQty(${item.id}, -1)" aria-label="Decrease quantity">−</button>
              <button type="button" class="qty-btn admin-only" onclick="changeQty(${item.id}, 1)" aria-label="Increase quantity">+</button>
              <button type="button" class="del-btn admin-only" onclick="deleteItem(${item.id})">Delete</button>
            </div>
          </div>
        `
        )
        .join("");
    }

    function changeQty(id, delta) {
      if (sessionStorage.getItem("pantryAdminUnlocked") !== "true") return;
      items = items.map((item) => {
        if (item.id !== id) return item;
        const nextQty = Math.max(0, Number(item.qty || 0) + delta);
        return { ...item, qty: nextQty, updated: formatTime(new Date()) };
      });
      saveItems();
      render();
    }

    function deleteItem(id) {
      if (sessionStorage.getItem("pantryAdminUnlocked") !== "true") return;
      items = items.filter((item) => item.id !== id);
      saveItems();
      render();
    }

    document.getElementById("stock-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (sessionStorage.getItem("pantryAdminUnlocked") !== "true") return;

      const nameInput = document.getElementById("item-name");
      const catInput = document.getElementById("item-cat");
      const qtyInput = document.getElementById("item-qty");

      const name = nameInput.value.trim();
      const category = catInput.value;
      const qty = Math.max(0, parseInt(qtyInput.value, 10) || 0);

      if (!name) return;

      items.unshift({
        id: Date.now(),
        name,
        category,
        qty,
        updated: formatTime(new Date())
      });

      saveItems();
      render();

      nameInput.value = "";
      qtyInput.value = "10";
      nameInput.focus();
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        render();
      });
    });

    function applyAdminState() {
      const isAdmin = sessionStorage.getItem("pantryAdminUnlocked") === "true";
      document.body.classList.toggle("is-admin", isAdmin);
      document.getElementById("role-status").textContent = isAdmin ? "Admin" : "View Only";
      document.getElementById("lock-btn").style.display = isAdmin ? "inline-block" : "none";
      document.getElementById("unlock-btn").style.display = isAdmin ? "none" : "inline-block";
      document.getElementById("admin-passcode").style.display = isAdmin ? "none" : "inline-block";
    }

    function unlockAdmin() {
      const input = document.getElementById("admin-passcode");
      if (input.value === ADMIN_CODE) {
        sessionStorage.setItem("pantryAdminUnlocked", "true");
        input.value = "";
        applyAdminState();
      } else {
        alert("Wrong passcode");
      }
    }

    function lockAdmin() {
      sessionStorage.removeItem("pantryAdminUnlocked");
      applyAdminState();
    }

    applyAdminState();
    render();
  </script>
</body>
</html>
