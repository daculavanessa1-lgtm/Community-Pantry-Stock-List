<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Pantry Stock List</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #15803d;
      --accent-hover: #166534;
      --ok-bg: #dcfce7;
      --ok-ink: #166534;
      --low-bg: #fef3c7;
      --low-ink: #92400e;
      --out-bg: #fee2e2;
      --out-ink: #991b1b;
      --danger: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      padding: 20px 14px 48px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    .stat-val.low {
      color: var(--low-ink);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(21, 128, 61, 0.25);
      border-color: var(--accent);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 11px 16px;
      font-size: 0.95rem;
      width: 100%;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 11px;
      font-size: 0.82rem;
      background: var(--card);
      color: var(--muted);
      border-color: var(--line);
    }

    .filter-btn.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .count-note {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .cat-tag {
      font-size: 0.75rem;
      color: var(--muted);
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok-ink);
    }

    .badge.low {
      background: var(--low-bg);
      color: var(--low-ink);
    }

    .badge.out {
      background: var(--out-bg);
      color: var(--out-ink);
    }

    .updated-text {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-box {
      min-width: 56px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .btn-step {
      width: 32px;
      height: 32px;
      font-size: 1rem;
      background: #f1f5f9;
      color: var(--ink);
      border-color: var(--line);
    }

    .btn-step:hover {
      background: #e2e8f0;
    }

    .btn-del {
      padding: 6px 9px;
      font-size: 0.8rem;
      background: transparent;
      color: var(--danger);
      border-color: #fecaca;
      margin-left: 4px;
    }

    .btn-del:hover {
      background: #fef2f2;
    }

    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      font-size: 0.92rem;
    }

    @media (max-width: 520px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .item-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        width: 100%;
        justify-content: flex-end;
      }

      .qty-box {
        margin-right: auto;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Community Pantry Stock List</h1>
      <p class="subtitle">Volunteer inventory tracker saved locally on this device (FR-01)</p>
    </header>

    <section class="summary" aria-label="Stock totals">
      <div class="stat">
        <div class="stat-label">Total Units in Stock</div>
        <div class="stat-val" id="totalUnits">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Low / Out of Stock</div>
        <div class="stat-val low" id="lowStockCount">0</div>
      </div>
    </section>

    <section class="card" aria-label="Add pantry item">
      <form id="pantryForm">
        <div class="form-grid">
          <div class="field">
            <label for="nameInput">Item Name</label>
            <input id="nameInput" type="text" placeholder="e.g., Canned Sardines" required />
          </div>
          <div class="field">
            <label for="categoryInput">Category</label>
            <select id="categoryInput">
              <option value="Food">Food</option>
              <option value="Hygiene">Hygiene</option>
              <option value="Household">Household</option>
            </select>
          </div>
          <div class="field">
            <label for="qtyInput">Quantity</label>
            <input id="qtyInput" type="number" min="0" step="1" value="10" required />
          </div>
          <div class="field full">
            <button class="btn-add" type="submit">Add Stock Item</button>
          </div>
        </div>
      </form>
    </section>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter by category">
        <button class="filter-btn active" data-filter="All" type="button">All</button>
        <button class="filter-btn" data-filter="Food" type="button">Food</button>
        <button class="filter-btn" data-filter="Hygiene" type="button">Hygiene</button>
        <button class="filter-btn" data-filter="Household" type="button">Household</button>
      </div>
      <span class="count-note" id="itemCount">0 items</span>
    </div>

    <main class="list" id="stockList" aria-live="polite"></main>
  </div>

  <script>
    const STORAGE_KEY = "pantry_stock_fr01_v1";
    const LOW_THRESHOLD = 5;
    let items = loadItems();
    let activeFilter = "All";

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function nowLabel() {
      return new Date().toLocaleTimeString("en-PH", {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function addItem(name, category, qty) {
      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: name.trim(),
        category,
        qty: Math.max(0, Math.floor(qty)),
        updated: nowLabel()
      };
      items.unshift(entry);
      saveItems();
      render();
    }

    function adjustQty(id, delta) {
      items = items.map((item) => {
        if (item.id !== id) return item;
        return {
          ...item,
          qty: Math.max(0, item.qty + delta),
          updated: nowLabel()
        };
      });
      saveItems();
      render();
    }

    function deleteItem(id) {
      items = items.filter((item) => item.id !== id);
      saveItems();
      render();
    }

    function statusBadge(qty) {
      if (qty === 0) return `<span class="badge out">Out</span>`;
      if (qty <= LOW_THRESHOLD) return `<span class="badge low">Low</span>`;
      return `<span class="badge ok">In Stock</span>`;
    }

    function render() {
      const totalUnits = items.reduce((sum, i) => sum + i.qty, 0);
      const lowCount = items.filter((i) => i.qty <= LOW_THRESHOLD).length;

      document.getElementById("totalUnits").textContent = totalUnits;
      document.getElementById("lowStockCount").textContent = lowCount;

      const visible = activeFilter === "All"
        ? items
        : items.filter((i) => i.category === activeFilter);

      document.getElementById("itemCount").textContent =
        `${visible.length} ${visible.length === 1 ? "item" : "items"}`;

      const listEl = document.getElementById("stockList");
      if (visible.length === 0) {
        listEl.innerHTML = `<div class="empty">No ${activeFilter === "All" ? "" : activeFilter + " "}items in stock yet.</div>`;
        return;
      }

      listEl.innerHTML = visible.map((item) => `
        <article class="item-row">
          <div>
            <div class="item-top">
              <span class="item-name">${escapeHtml(item.name)}</span>
              <span class="cat-tag">${escapeHtml(item.category)}</span>
              ${statusBadge(item.qty)}
            </div>
            <div class="updated-text">Updated ${escapeHtml(item.updated)}</div>
          </div>
          <div class="controls">
            <span class="qty-box">${item.qty} pcs</span>
            <button class="btn-step" type="button" aria-label="Decrease ${escapeHtml(item.name)}" onclick="adjustQty('${item.id}', -1)">−</button>
            <button class="btn-step" type="button" aria-label="Increase ${escapeHtml(item.name)}" onclick="adjustQty('${item.id}', 1)">+</button>
            <button class="btn-del" type="button" aria-label="Delete ${escapeHtml(item.name)}" onclick="deleteItem('${item.id}')">Delete</button>
          </div>
        </article>
      `).join("");
    }

    document.getElementById("pantryForm").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const nameInput = document.getElementById("nameInput");
      const categoryInput = document.getElementById("categoryInput");
      const qtyInput = document.getElementById("qtyInput");

      const qty = parseInt(qtyInput.value, 10);
      if (!nameInput.value.trim() || Number.isNaN(qty) || qty < 0) return;

      addItem(nameInput.value, categoryInput.value, qty);
      ev.target.reset();
      qtyInput.value = "10";
      nameInput.focus();
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach((b) =>
          b.classList.toggle("active", b === btn)
        );
        render();
      });
    });

    render();
  </script>
</body>
  </html>
